<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop PDF</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tools.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<div class="logo">

<i class="fa-solid fa-crop-simple"></i>

PDF Master

</div>

</header>

<section class="tool-hero">

<h1>Crop PDF</h1>

<p>

Crop PDF pages online quickly and securely.

</p>

</section>

<section class="upload-section">

<div class="drop-area" id="dropArea">

<i class="fa-solid fa-file-pdf"></i>

<h2>Select PDF File</h2>

<p>or Drag & Drop PDF Here</p>

<button id="browseBtn" class="pdf-btn">

Select PDF

</button>

<input
type="file"
id="upload"
accept=".pdf"
hidden>

</div>

</section>

<section id="fileList">

<div class="empty">

No PDF Selected

</div>

</section>

<section class="pdf-options">

<label>Left (px)</label>

<input
type="number"
id="left"
value="20">

<label>Right (px)</label>

<input
type="number"
id="right"
value="20">

<label>Top (px)</label>

<input
type="number"
id="top"
value="20">

<label>Bottom (px)</label>

<input
type="number"
id="bottom"
value="20">

</section>

<section class="pdf-action">

<button id="cropBtn" class="pdf-btn">

<i class="fa-solid fa-crop-simple"></i>

Crop PDF

</button>

</section>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script src="js/crop-pdf.js"></script>

</body>

</html>
