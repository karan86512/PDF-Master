<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unlock PDF</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tools.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<div class="logo">

<i class="fa-solid fa-lock-open"></i>

PDF Master

</div>

</header>

<section class="tool-hero">

<h1>Unlock PDF</h1>

<p>

Remove password protection from your PDF.

</p>

</section>

<section class="upload-section">

<div class="drop-area" id="dropArea">

<i class="fa-solid fa-file-pdf"></i>

<h2>Select PDF File</h2>

<p>or Drag & Drop PDF Here</p>

<button id="browseBtn" class="pdf-btn">

Select PDF

</button>

<input
type="file"
id="upload"
accept=".pdf"
hidden>

</div>

</section>

<section id="fileList">

<div class="empty">

No PDF Selected

</div>

</section>

<section class="pdf-options">

<label>PDF Password</label>

<input
type="password"
id="password"
placeholder="Enter PDF Password">

</section>

<section class="pdf-action">

<button id="unlockBtn" class="pdf-btn">

<i class="fa-solid fa-lock-open"></i>

Unlock PDF

</button>

</section>

<script src="js/unlock-pdf.js"></script>

</body>

</html>
