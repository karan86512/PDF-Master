<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word to PDF</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tools.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<div class="logo">

<i class="fa-solid fa-file-word"></i>

PDF Master

</div>

</header>

<section class="tool-hero">

<h1>Word to PDF</h1>

<p>

Convert DOCX files into PDF documents.

</p>

</section>

<section class="upload-section">

<div class="drop-area" id="dropArea">

<i class="fa-solid fa-file-word"></i>

<h2>Select Word File</h2>

<p>or Drag & Drop DOCX Here</p>

<button id="browseBtn" class="pdf-btn">

Select Word

</button>

<input
type="file"
id="upload"
accept=".doc,.docx"
hidden>

</div>

</section>

<section id="fileList">

<div class="empty">

No Word File Selected

</div>

</section>

<section class="pdf-action">

<button id="convertBtn" class="pdf-btn">

<i class="fa-solid fa-file-pdf"></i>

Convert to PDF

</button>

</section>

<script src="js/word-to-pdf.js"></script>

</body>

</html>
